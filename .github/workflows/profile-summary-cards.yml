name: Update profile summary cards

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-summary-cards.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate live GitHub cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 6
          THEME: github_dark
          ANIMATION: rise
          AUTO_PUSH: false

      - name: Upload generated cards
        uses: actions/upload-artifact@v4
        with:
          name: profile-summary-cards
          path: profile-summary-card-output/github_dark
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Download generated cards
        uses: actions/download-artifact@v4
        with:
          name: profile-summary-cards
          path: profile-summary-card-output/github_dark

      - name: Publish updated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/github_dark
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update live GitHub profile cards"
          git push
